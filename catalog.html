<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرست کتابخانه نواندیشان</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f3f6fa;color:#203448;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:white;border:1px solid #dfe7ef;border-radius:18px;padding:20px;box-shadow:0 10px 28px #1736530d}.hero{background:linear-gradient(120deg,#142f50,#147d78);color:white}.hero h1{margin:0}.hero p{margin:8px 0 0}.tools{display:flex;gap:10px;margin:18px 0}.tools input{flex:1;padding:12px;border:1px solid #d6e0e9;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card h3{margin:8px 0}.muted{color:#68798c;font-size:13px}.cover{width:70px;height:90px;object-fit:cover;border-radius:8px;background:#edf2f7}.msg{padding:14px;background:#e4efea;border-radius:10px;margin:12px 0}@media(max-width:600px){.wrap{padding:12px}.tools{flex-direction:column}}</style></head><body><main class="wrap"><header class="hero"><h1>📚 فهرست کتابخانهٔ نواندیشان</h1><p>جست‌وجو و مشاهدهٔ کتاب‌های موجود در کتابخانه</p></header><div id="message" class="msg">در حال دریافت فهرست کتاب‌ها…</div><div class="tools"><input id="search" placeholder="جست‌وجو بر اساس عنوان، نویسنده، ناشر یا موضوع"></div><section id="books" class="grid"></section></main><script>const URL='https://cyphdbqeleavcdjoknuu.supabase.co';const KEY='sb_publishable_kW5hJXjtEtqs4ndBWvvFfQ_Bbfm1E0a';const client=window.supabase.createClient(URL,KEY);let books=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const q=document.querySelector('#search').value.trim().toLocaleLowerCase('fa');const rows=books.filter(b=>[b.title,b.author,b.publisher,b.category,b.subject,b.book_code].join(' ').toLocaleLowerCase('fa').includes(q));document.querySelector('#books').innerHTML=rows.length?rows.map(b=>`<article class="card">${b.cover_url?`<img class="cover" src="${esc(b.cover_url)}" alt="جلد ${esc(b.title)}">`:'<div class="cover">📖</div>'}<h3>${esc(b.title)}</h3><div class="muted">کد: ${esc(b.book_code||'—')}</div><p class="muted">${esc(b.author||'نویسنده ثبت نشده')}</p><p class="muted">${esc(b.publisher||'')} ${b.category?'· '+esc(b.category):''}</p>${b.description?`<p>${esc(b.description)}</p>`:''}</article>`).join(''):'<div class="card">کتابی با این مشخصات پیدا نشد.</div>';document.querySelector('#message').textContent=`تعداد عنوان‌های نمایش‌داده‌شده: ${rows.length}`;}document.querySelector('#search').addEventListener('input',draw);(async()=>{const {data,error}=await client.from('books').select('id,book_code,title,author,publisher,category,description,cover_url,subject').order('title');if(error){document.querySelector('#message').textContent='دریافت فهرست ناموفق بود. لطفاً دسترسی عمومی جدول books بررسی شود: '+error.message;return;}books=data||[];draw();})();</script></body></html>
